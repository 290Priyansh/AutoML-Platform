apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: automl
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: YOUR_ECR_URI/automl-api:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: automl-config
        - secretRef:
            name: automl-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      serviceAccountName: automl-sa
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: automl
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP