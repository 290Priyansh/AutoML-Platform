apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: automl-ingress
  namespace: automl
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
  - hosts:
    - api.automl.example.com
    - mlflow.automl.example.com
    secretName: automl-tls
  rules:
  - host: api.automl.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 80
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 80
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 80
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 80
  - host: mlflow.automl.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mlflow
            port:
              number: 5000